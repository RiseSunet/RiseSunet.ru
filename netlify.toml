# Отключаем служебный HTML, который Netlify добавляет на бесплатные сайты:
# баннер «Powered by Netlify» и скрипт /.netlify/scripts/hud.
# Это убирает лишний сетевой запрос и ускоряет загрузку.

[build]
  publish = "."
  command = ""

# Заголовки для всех страниц — отключаем инъекции HUD.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Яндекс-подтверждение отдаём чистым текстом (без HTML-инъекций Netlify).
[[headers]]
  for = "/yandex_7e64387bb9be3053.html"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
