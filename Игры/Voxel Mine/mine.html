<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Voxel Mine - Mob Update</title>
<style>
@font-face{
  font-family:'Press Start 2P';
  src:url('PressStart2P-Regular.ttf') format('truetype');
  font-display:swap;
}
html, body { margin: 0; padding: 0; overflow: hidden; height: 100dvh; background: #3b2a1a; font-family: 'Press Start 2P', monospace; user-select: none; -webkit-user-select: none; touch-action: none; color: #fff; }
canvas { display: none; touch-action: none; position: fixed; top: 0; left: 0; z-index: 1; }
#loading-screen { position: fixed; inset: 0; z-index: 9999; background: #2a1b10; display: none; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen.active { display: flex; }
.loading-box { background: #f0f0f0; border: 4px solid #fff; box-shadow: 4px 4px 0 #000; width: 320px; height: 240px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
.voxel-logo { font-size: 32px; color: #ff5555; text-align: center; line-height: 1.4; text-shadow: 3px 3px 0 #000; transform: skewX(-10deg); }
.voxel-logo span { color: #5555ff; }
#loading-status { font-size: 12px; color: #aaa; margin-bottom: 15px; }
.loading-bar-container { width: 300px; height: 16px; background: #000; border: 2px solid #555; position: relative; margin-bottom: 10px; }
#loading-bar { height: 100%; width: 0%; background: #55ff55; transition: width 0.1s linear; }
#loading-percent { font-size: 10px; }
#ui-layer { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; background: #3b2a1a; overflow-y: auto; height: 100dvh; }
#ui-layer.hidden { display: none !important; }
#pause-layer, #death-screen, #ad-modal { position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.7); display: none; flex-direction: column; align-items: center; justify-content: center; }
#pause-layer.active, #death-screen.active, #ad-modal.active { display: flex; }
.screen { display: none; flex-direction: column; align-items: center; width: 100%; min-height: 100%; padding: 20px 20px 120px 20px; box-sizing: border-box; overflow-y: auto; }
.screen.active { display: flex; }
.screen-inner { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px; margin: auto; }
#screen-main .logo { font-size: 48px; color: #fff; text-shadow: 4px 4px 0 #3f3f3f; letter-spacing: 6px; margin-bottom: 20px; }
#screen-main .splash { color: #ffff00; font-size: 14px; text-shadow: 2px 2px 0 #3f3f00; transform: rotate(-15deg); margin-top: -20px; margin-bottom: 20px; align-self: flex-end; margin-right: 20%; animation: pulse 0.8s infinite alternate; }
@keyframes pulse { from { transform: rotate(-15deg) scale(1); } to { transform: rotate(-15deg) scale(1.1); } }
.title { font-size: 24px; margin-bottom: 20px; text-align: center; }
.mc-btn { width: 100%; max-width: 400px; height: 40px; margin: 4px; background: #727272; border: 2px solid #000; box-shadow: inset 2px 2px 0 #a0a0a0, inset -2px -2px 0 #3f3f3f; color: #fff; font-family: 'Press Start 2P', monospace; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.mc-btn:disabled { color: #a0a0a0; background: #3f3f3f; cursor: not-allowed; }
.btn-col { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px; }
.btn-row { display: flex; width: 100%; max-width: 500px; justify-content: center; gap: 6px; margin-top: 10px; }
.row-2 .mc-btn { flex: 1; font-size: 10px; }
.row-4 .mc-btn { flex: 1; font-size: 9px; }
.mc-input { width: 100%; max-width: 400px; height: 30px; margin: 5px 0; background: #000; border: 2px solid #aaa; color: #fff; font-family: 'Press Start 2P', monospace; font-size: 12px; padding: 0 10px; outline: none; box-sizing: border-box; }
.world-list-container { width: 100%; max-width: 500px; height: 300px; background: rgba(0,0,0,0.5); border: 2px solid #000; overflow-y: auto; margin-bottom: 10px; }
.world-item { display: flex; align-items: center; padding: 10px; cursor: pointer; border-bottom: 1px solid #333; }
.world-item:hover { background: rgba(255,255,255,0.1); }
.world-item.selected { border: 2px solid #fff; background: rgba(255,255,255,0.2); }
.world-info { margin-left: 10px; }
.world-name { font-size: 12px; margin-bottom: 5px; }
.world-meta { font-size: 8px; color: #aaa; }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 500px; margin-bottom: 20px; }
.setting-item { background: #000; border: 2px solid #aaa; padding: 5px; cursor: pointer; height: 40px; display: flex; flex-direction: column; justify-content: center; }
.setting-label { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
input[type=range] { width: 100%; margin-top: 5px;}
#game-ui { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); }
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
#crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
#crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
#survival-hud { position: absolute; bottom: 66px; left: 50%; transform: translateX(-50%); width: 440px; display: flex; justify-content: space-between; }
.hud-group { display: flex; gap: 1px; }
.hud-icon { width: 18px; height: 18px; background-size: contain; background-repeat: no-repeat; }
#bottom-ui { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto; }
#hotbar-container { display: flex; gap: 2px; padding: 2px; background: rgba(0,0,0,.5); border: 2px solid #555; }
.slot { width: 42px; height: 42px; position: relative; border: 2px solid #8b8b8b; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.slot.active { border-color: #fff; box-shadow: 0 0 0 2px #fff inset; }
.slot img { width: 30px; height: 30px; }
.count { position: absolute; bottom: 2px; right: 2px; font-size: 10px; text-shadow: 2px 2px 0 #000; }
#btn-inventory { width: 46px; height: 46px; background: rgba(111,111,111,0.8); border: 2px solid #000; color: #fff; font-size: 24px; display: none; align-items: center; justify-content: center; pointer-events: auto; }
body.touch #btn-inventory { display: flex; }
#touch-controls { display: none; position: absolute; inset: 0; pointer-events: none; }
body.touch #touch-controls { display: block; }
#joystick { position: absolute; bottom: 80px; left: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.4); pointer-events: auto; z-index: 90; }
#joystick-knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.4); transform: translate(-50%, -50%); }
#action-buttons { position: absolute; bottom: 80px; right: 24px; display: grid; grid-template-columns: 65px 65px; grid-template-rows: 65px 65px; gap: 10px; pointer-events: auto; z-index: 90; }
#action-buttons button { width: 65px; height: 65px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.15); color: #fff; font-size: 22px; }
#btn-pause, #btn-camera { position: absolute; top: 10px; width: 40px; height: 40px; background: #6f6f6f; border: 2px solid #000; color: #fff; display: none; pointer-events: auto; z-index: 100; }
body.touch #btn-pause, body.touch #btn-camera { display: block; }
#btn-pause { right: 10px; } #btn-camera { left: 10px; }
#inventory-screen, #survival-inventory { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.5); flex-direction: column; align-items: center; justify-content: center; }
#inventory-screen.active, #survival-inventory.active { display: flex; }
.inv-panel, .surv-panel { width: 95%; max-width: 600px; max-height: 90dvh; background: #c6c6c6; border: 4px solid #fff; border-bottom-color: #555; border-right-color: #555; display: flex; flex-direction: column; padding: 15px; color: #3f3f3f; position: relative; }
.close-btn { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; background: #ff5555; border: 2px solid #000; color: #fff; cursor: pointer; }
.inv-title { font-size: 14px; margin-bottom: 15px; text-shadow: 1px 1px 0 #fff; text-align: center; }
.inv-grid-container { flex-grow: 1; overflow-y: auto; background: #8b8b8b; border: 2px solid #373737; padding: 5px; margin-bottom: 15px; }
.inv-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; }
.inv-item, .surv-slot { aspect-ratio: 1; background: #8b8b8b; border: 2px solid #fff; border-bottom-color: #373737; border-right-color: #373737; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.inv-item img, .surv-slot img { width: 80%; height: 80%; }
.inv-hotbar { display: flex; gap: 2px; justify-content: center; }
.inv-hotbar .slot { width: 40px; height: 40px; background: #8b8b8b; border: 2px solid #373737; }
.surv-storage-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; background: #8b8b8b; padding: 5px; border: 2px solid #373737; margin-bottom: 10px; }
#toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5000; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
.toast { background: rgba(0,0,0,0.8); border: 2px solid #fff; color: #fff; padding: 10px 20px; font-size: 10px; animation: fadeInOut 3s forwards; }
@keyframes fadeInOut { 0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-box"><div class="voxel-logo">ВОКСЕЛЬ<br><span>МАЙН</span></div></div>
  <div id="loading-status">Загрузка...</div>
  <div class="loading-bar-container"><div id="loading-bar"></div></div>
  <div id="loading-percent">0%</div>
</div>

<div id="ui-layer">
  <div id="screen-main" class="screen active">
    <div class="screen-inner" style="justify-content: center; min-height: 100%;">
      <div class="logo">VOXEL MINE</div>
      <div class="splash">Мобы!</div>
      <div class="btn-col">
        <button class="mc-btn" onclick="showScreen('screen-select')">Одиночная игра</button>
        <button class="mc-btn" onclick="showScreen('screen-skins')">Скины</button>
        <button class="mc-btn" onclick="openSettings()">Настройки...</button>
        <button class="mc-btn" onclick="location.reload()">Выйти</button>
      </div>
    </div>
  </div>

  <div id="screen-select" class="screen">
    <div class="screen-inner">
      <div class="title">Выбрать мир</div>
      <div class="world-list-container" id="world-list"></div>
      <div class="btn-row row-2">
        <button class="mc-btn" id="btn-play-world" onclick="playSelectedWorld()" disabled>Играть</button>
        <button class="mc-btn" onclick="showScreen('screen-create')">Создать</button>
      </div>
      <div class="btn-row row-4">
        <button class="mc-btn" id="btn-save-folder" onclick="saveWorldToFolderDialog()" disabled>В папку</button>
        <button class="mc-btn" id="btn-delete-world" onclick="deleteSelectedWorld()" disabled>Удалить</button>
        <button class="mc-btn" onclick="showScreen('screen-main')">Назад</button>
      </div>
    </div>
  </div>

  <div id="screen-create" class="screen">
    <div class="screen-inner">
      <div class="title">Создание мира</div>
      <input type="text" id="input-name" class="mc-input" value="Новый мир" maxlength="30">
      <button class="mc-btn" id="btn-mode-cycle" onclick="cycleCreateMode()" style="margin-top: 15px;">Режим: Творческий</button>
      <div class="btn-row row-2" style="margin-top:20px;">
        <button class="mc-btn" onclick="createNewWorld()">Создать</button>
        <button class="mc-btn" onclick="showScreen('screen-select')">Отмена</button>
      </div>
    </div>
  </div>

  <div id="screen-settings" class="screen">
    <div class="screen-inner">
      <div class="title">Параметры</div>
      <div class="settings-grid">
        <div class="setting-item"><div class="setting-label">Громкость: <span id="val-music">100</span>%</div><input type="range" id="set-music" min="0" max="100" value="100" oninput="document.getElementById('val-music').textContent = this.value"></div>
        <div class="setting-item cycle-btn" onclick="toggleInvertMouse()"><div class="setting-label" id="lbl-invert">Инверсия мыши: ВЫКЛ</div></div>
        <div class="setting-item"><div class="setting-label">Чувствительность: <span id="val-sens">100</span>%</div><input type="range" id="set-sens" min="10" max="200" value="100" oninput="document.getElementById('val-sens').textContent = this.value"></div>
        <div class="setting-item"><div class="setting-label">Поле зрения: <span id="val-fov">Нормально</span></div><input type="range" id="set-fov" min="30" max="110" value="70" oninput="updateFovLabel(this.value)"></div>
        <div class="setting-item cycle-btn" onclick="cycleDifficulty()"><div class="setting-label" id="lbl-diff">Сложность: Нормальная</div></div>
        <div class="setting-item"><div class="setting-label">Дальность: <span id="val-render">5</span></div><input type="range" id="set-render" min="2" max="10" value="5" oninput="document.getElementById('val-render').textContent = this.value"></div>
      </div>
      <div class="btn-col" style="max-width: 400px;"><button class="mc-btn" onclick="saveAndCloseSettings()">Готово</button></div>
    </div>
  </div>
</div>

<div id="pause-layer">
  <div class="title">Меню</div>
  <div class="btn-col">
    <button class="mc-btn" onclick="resumeGame()">Вернуться</button>
    <button class="mc-btn" onclick="openSettings()">Настройки...</button>
    <button class="mc-btn" onclick="saveAndQuitGame()">Сохранить и выйти</button>
  </div>
</div>

<div id="death-screen">
  <div class="title" style="color:#ff5555;">Ты погиб!</div>
  <button class="mc-btn" onclick="respawnPlayer()">Возродиться</button>
</div>

<div id="game-ui">
  <div id="crosshair"></div>
  <div id="survival-hud"><div class="hud-group" id="hud-hearts"></div></div>
  <div id="touch-controls">
    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="action-buttons">
      <button id="btn-place">▦</button><button id="btn-jump">▲</button><button id="btn-break">⛏</button><button id="btn-down">▼</button>
    </div>
  </div>
  <div id="bottom-ui">
    <div id="hotbar-container"></div>
    <button id="btn-inventory">⋮</button>
  </div>
  <button id="btn-pause">⏸</button>
  <button id="btn-camera">👁</button>
</div>

<div id="inventory-screen"><div class="inv-panel"><button class="close-btn" onclick="toggleInventory()">X</button><div class="inv-title">Выбор блока</div><div class="inv-grid-container"><div class="inv-grid" id="inv-grid"></div></div><div class="inv-hotbar" id="inv-hotbar"></div></div></div>
<div id="survival-inventory"><div class="surv-panel"><button class="close-btn" onclick="toggleInventory()">X</button><div class="inv-title">Инвентарь</div><div class="surv-storage-grid" id="surv-storage"></div><div class="inv-hotbar" id="surv-hotbar"></div></div></div>
<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';
const THREE = window.THREE;

// --- ФОН МЕНЮ ---
(function makeDirtBg() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d'); const img = ctx.createImageData(64, 64);
  for (let i = 0; i < img.data.length; i += 4) { const shade = 120 + Math.random() * 40; img.data[i] = shade + 20; img.data[i+1] = shade - 20; img.data[i+2] = shade - 40; img.data[i+3] = 255; }
  ctx.putImageData(img, 0, 0); document.getElementById('ui-layer').style.backgroundImage = `url(${c.toDataURL()})`;
})();

const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
document.body.classList.toggle('touch', isTouch);

let savedSettings = {}; try { savedSettings = JSON.parse(localStorage.getItem('mc_settings')) || {}; } catch(e) {}
const SETTINGS = { sens: savedSettings.sens ?? 100, fov: savedSettings.fov ?? 70, invertY: savedSettings.invertY ?? false, difficulty: savedSettings.difficulty ?? 'Нормальная', renderDist: savedSettings.renderDist ?? 5, volume: savedSettings.volume ?? 100 };

// --- ЗВУКИ ---
let audioCtx = null;
function playSound(type) {
  if (SETTINGS.volume === 0) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  const vol = (SETTINGS.volume / 100) * 0.1; const now = audioCtx.currentTime;
  if (type === 'break') { osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1); gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
  else if (type === 'place') { osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1); gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
  else if (type === 'step') { osc.type = 'sine'; osc.frequency.setValueAtTime(100, now); gain.gain.setValueAtTime(vol * 0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05); }
  else if (type === 'hurt') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.2); gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2); }
}

// --- БЛОКИ И ЯЙЦА ---
// Индексы тайлов подобраны под новый атлас 512x512 (32x32, 16px/тайл). При необходимости можно поправить номера.
const BLOCKS = {
  1: { name: 'Трава', tiles: { top: 324, side: 321, bottom: 168 } }, // верх (тонируется), бок-трава, низ-земля
  2: { name: 'Земля', tiles: { all: 168 } },
  3: { name: 'Камень', tiles: { all: 211 } },
  4: { name: 'Дерево', tiles: { top: 424, side: 423, bottom: 424 } },  // срез, кора, срез
  5: { name: 'Листва', tiles: { all: 393 }, transparent: true, cullSame: false },
  6: { name: 'Песок', tiles: { all: 146 } },
  7: { name: 'Светокамень', tiles: { all: 302 }, light: 15 },
  8: { name: 'Кирпич', tiles: { all: 101 } },
  9: { name: 'Доски', tiles: { all: 488 } },
  10: { name: 'Булыжник', tiles: { all: 163 } },
  11: { name: 'Стекло', tiles: { all: 143 }, transparent: true },
  12: { name: 'Лава', tiles: { all: 0 }, light: 15, fluid: 'lava', fluidSource: true, fluidDist: 0 },
  13: { name: 'Бедрок', tiles: { all: 100 } },
  14: { name: 'Угольная руда', tiles: { all: 161 } },
  15: { name: 'Железная руда', tiles: { all: 384 } },
  16: { name: 'Золотая руда', tiles: { all: 320 } },
  17: { name: 'Алмазная руда', tiles: { all: 136 } },
  18: { name: 'Вода', tiles: { all: 404 }, transparent: true, fluid: 'water', fluidSource: true, fluidDist: 0 }
};

// Текущие (неисточниковые) уровни жидкостей: вода растекается на 8, лава на 4
for (let d = 1; d <= 8; d++) BLOCKS[18 + d] = { name: 'Вода', tiles: { all: 404 }, transparent: true, fluid: 'water', fluidSource: false, fluidDist: d };
for (let d = 1; d <= 4; d++) BLOCKS[26 + d] = { name: 'Лава', tiles: { all: 0 }, light: 15, fluid: 'lava', fluidSource: false, fluidDist: d };

function fluidFamily(b) { return BLOCKS[b]?.fluid || null; }
function isFluidBlock(b) { return !!BLOCKS[b]?.fluid; }
function isFluidSource(b) { return !!(BLOCKS[b]?.fluid && BLOCKS[b].fluidSource); }
function fluidFlowId(type, d) { return type === 'water' ? 18 + d : 26 + d; }
function fluidMaxDist(type) { return type === 'water' ? 8 : 4; }

const EGGS = {
  100: { name: 'Яйцо зомби', mob: 'zombie' },
  101: { name: 'Яйцо свиньи', mob: 'pig' }
};

function generateEggTexture(baseColor, spotColor) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const ctx = c.getContext('2d');
  ctx.fillStyle = baseColor;
  ctx.beginPath(); ctx.ellipse(8, 9, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = spotColor;
  ctx.fillRect(6, 5, 3, 3); ctx.fillRect(10, 10, 2, 2); ctx.fillRect(4, 11, 2, 2); ctx.fillRect(9, 6, 2, 2);
  return c.toDataURL();
}
const eggTextures = {
  100: generateEggTexture('#2b5c2b', '#00a8a8'),
  101: generateEggTexture('#ffaaaa', '#ff5555')
};

// --- ГЕНЕРАЦИЯ АТЛАСА ---
// Новый атлас: 512x512, сетка 32x32 тайлов по 16px (индексы 0-1023)
const ATLAS_COLS = 32;
const ATLAS_TILE = 16;
const ATLAS_SIZE = ATLAS_COLS * ATLAS_TILE;
const atlas = document.createElement('canvas');
atlas.width = ATLAS_SIZE; atlas.height = ATLAS_SIZE;
const actx = atlas.getContext('2d');

function generatePlaceholderAtlas() {
  const TS = ATLAS_TILE;
  const rnd = a => (Math.random() - 0.5) * a;
  const rgb = (r, g, b) => `rgb(${Math.min(255, Math.max(0, r|0))},${Math.min(255, Math.max(0, g|0))},${Math.min(255, Math.max(0, b|0))})`;
  function paint(tile, fn) { 
    const tx = (tile % ATLAS_COLS) * TS, ty = Math.floor(tile / ATLAS_COLS) * TS; 
    for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {

function createCanvasTex(drawFn) {
  const c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const ctx = c.getContext('2d'); drawFn(ctx);
  const tex = new THREE.CanvasTexture(c); tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; return tex;
}
const mobTex = {
  zHead: createCanvasTex(ctx => { ctx.fillStyle = '#2b5c2b'; ctx.fillRect(0,0,16,16); ctx.fillStyle = '#182e18'; ctx.fillRect(2,4,3,3); ctx.fillRect(11,4,3,3); ctx.fillRect(4,10,8,2); }),
  zBody: createCanvasTex(ctx => { ctx.fillStyle = '#00a8a8'; ctx.fillRect(0,0,16,16); ctx.fillStyle = '#2b5c2b'; ctx.fillRect(0,0,16,4); }),
  zPants: createCanvasTex(ctx => { ctx.fillStyle = '#1a1a8c'; ctx.fillRect(0,0,16,16); }),
  pBody: createCanvasTex(ctx => { ctx.fillStyle = '#ffaaaa'; ctx.fillRect(0,0,16,16); }),
  pFace: createCanvasTex(ctx => { ctx.fillStyle = '#ffaaaa'; ctx.fillRect(0,0,16,16); ctx.fillStyle = '#ff5555'; ctx.fillRect(4,6,8,6); ctx.fillStyle = '#000'; ctx.fillRect(5,7,2,2); ctx.fillRect(9,7,2,2); }),
};

const mkMat = (tex) => new THREE.MeshBasicMaterial({ map: tex });

// Скины грузим как обычные <img>. THREE.Texture НЕ является CanvasImageSource,

const mobImages = { zombie: null, pig: null };
const cachedSkinMats = { zombie: null, pig: null };
const skinBaseCache = new WeakMap();

function loadMobSkin(type, url) {
  const img = new Image();

    cachedSkinMats[type] = null; // сброс кэша: скин мог прийти после спавна мобов
    refreshMobSkins(type);
  };
  img.onerror = () => console.warn(`Скин ${type} не загружен: ${url}`);
  img.src = url;
}

// Стандартная раскладка скина 64x64. Масштабируется под любой размер файла
// (у нас файлы 256x256, то есть 4 пикселя на «скин-пиксель»).
const SKIN_PARTS = {
  head:     { right: [0, 8, 8, 8],   left: [16, 8, 8, 8],  top: [8, 0, 8, 8],   bottom: [16, 0, 8, 8], front: [8, 8, 8, 8],   back: [24, 8, 8, 8] },
  body:     { right: [16, 20, 4, 12], left: [28, 20, 4, 12], top: [20, 16, 8, 4], bottom: [28, 16, 8, 4], front: [20, 20, 8, 12], back: [32, 20, 8, 12] },
  rightArm: { right: [40, 20, 4, 12], left: [48, 20, 4, 12], top: [44, 16, 4, 4], bottom: [48, 16, 4, 4], front: [44, 20, 4, 12], back: [52, 20, 4, 12] },
  leftArm:  { right: [32, 52, 4, 12], left: [40, 52, 4, 12], top: [36, 48, 4, 4], bottom: [40, 48, 4, 4], front: [36, 52, 4, 12], back: [44, 52, 4, 12] },
  rightLeg: { right: [0, 20, 4, 12],  left: [8, 20, 4, 12],  top: [4, 16, 4, 4],  bottom: [8, 16, 4, 4],  front: [4, 20, 4, 12],  back: [12, 20, 4, 12] },
  leftLeg:  { right: [16, 52, 4, 12], left: [24, 52, 4, 12], top: [20, 48, 4, 4], bottom: [24, 48, 4, 4], front: [20, 52, 4, 12], back: [28, 52, 4, 12] }
};
const FACE_ORDER = ['right', 'left', 'top', 'bottom', 'front', 'back']; // порядок групп BoxGeometry

function getSkinBase(img) {
  let ctx = skinBaseCache.get(img);
  if (!ctx) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, 64, 64);
    skinBaseCache.set(img, ctx);
  }
  return ctx;
}

// Старые скины 64x32 оставляют вторую руку/ногу белой — тогда берём текстуру
// первой руки/ноги (так делает Minecraft).
function isBlankSkinRegion(img, uv) {
  try {
    const d = getSkinBase(img).getImageData(uv[0], uv[1], uv[2], uv[3]).data;
    let brightness = 0, alpha = 0;
    for (let i = 0; i < d.length; i += 4) {
      brightness += (d[i] + d[i + 1] + d[i + 2]) / 3;
      alpha += d[i + 3];
    }
    return alpha === 0 || brightness / (d.length / 4) > 245;
  } catch (e) { return false; }
}

function getSkinMaterials(img, part) {
  if (!img || !img.width || !img.height) return null;
  let uvs = SKIN_PARTS[part];
  if (!uvs) return null;
  if ((part === 'leftArm' || part === 'leftLeg') && isBlankSkinRegion(img, uvs.front)) {
    uvs = part === 'leftArm' ? SKIN_PARTS.rightArm : SKIN_PARTS.rightLeg;
  }
  const scaleX = img.width / 64, scaleY = img.height / 64;
  return FACE_ORDER.map(f => {
    const [x, y, w, h] = uvs[f];
    const cvs = document.createElement('canvas');
    cvs.width = Math.max(1, Math.round(w * scaleX));
    cvs.height = Math.max(1, Math.round(h * scaleY));
    const ctx = cvs.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, x * scaleX, y * scaleY, w * scaleX, h * scaleY, 0, 0, cvs.width, cvs.height);
    const tex = new THREE.CanvasTexture(cvs);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.colorSpace = THREE.SRGBColorSpace;
    return new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5 });
  });
}

function getCachedMobMats(type) {
  const img = mobImages[type];
  if (!img) return null;
  if (cachedSkinMats[type]) return cachedSkinMats[type];
  const mats = {
    head: getSkinMaterials(img, 'head'),
    body: getSkinMaterials(img, 'body'),
    rightArm: getSkinMaterials(img, 'rightArm'),
    leftArm: getSkinMaterials(img, 'leftArm'),
    rightLeg: getSkinMaterials(img, 'rightLeg'),
    leftLeg: getSkinMaterials(img, 'leftLeg')
  };
  if (!mats.head || !mats.body) return null;
  cachedSkinMats[type] = mats;
  return mats;
}

const CHUNK_SIZE = 16, WORLD_HEIGHT = 128, SECTIONS_Y = WORLD_HEIGHT / CHUNK_SIZE;
let CX = 16, CZ = 16;
let world = new Uint8Array(CX * CHUNK_SIZE * WORLD_HEIGHT * CZ * CHUNK_SIZE);
let lightMap = new Uint8Array(CX * CHUNK_SIZE * WORLD_HEIGHT * CZ * CHUNK_SIZE);
let worldSpawn = { x: CX * CHUNK_SIZE / 2, y: 100, z: CZ * CHUNK_SIZE / 2 };
let seedOffset = 0, currentWorldData = null, timeOfDay = 0.25;

function idx(x, y, z) { return x + CX*CHUNK_SIZE * (z + CZ*CHUNK_SIZE * y); }
function getBlock(x, y, z) { if (y < 0 || y >= WORLD_HEIGHT || x < 0 || x >= CX*CHUNK_SIZE || z < 0 || z >= CZ*CHUNK_SIZE) return 0; return world[idx(x, y, z)]; }
function setBlock(x, y, z, v, record = true) { if (y < 0 || y >= WORLD_HEIGHT || x < 0 || x >= CX*CHUNK_SIZE || z < 0 || z >= CZ*CHUNK_SIZE) return; world[idx(x, y, z)] = v; if (record && currentWorldData) currentWorldData.changedBlocks[`${x},${y},${z}`] = v; }
function getLight(x, y, z) { if (y < 0 || y >= WORLD_HEIGHT || x < 0 || x >= CX*CHUNK_SIZE || z < 0 || z >= CZ*CHUNK_SIZE) return 15; return lightMap[idx(x, y, z)]; }
function setLight(x, y, z, v) { if (y < 0 || y >= WORLD_HEIGHT || x < 0 || x >= CX*CHUNK_SIZE || z < 0 || z >= CZ*CHUNK_SIZE) return; lightMap[idx(x, y, z)] = v; }

const smooth = t => t * t * (3 - 2 * t);
function hash2(x, z) { let h = Math.imul(x, 374761393) + Math.imul(z, 668265263) + seedOffset; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function valueNoise(x, z) { const xi = Math.floor(x), zi = Math.floor(z), u = smooth(x - xi), v = smooth(z - zi); const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1); return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v; }
function fbm(x, z) { let val = 0, amp = 0.5, freq = 1, sum = 0; for (let i = 0; i < 4; i++) { val += valueNoise(x * freq, z * freq) * amp; sum += amp; amp *= 0.5; freq *= 2; } return val / sum; }
function hash3(x, y, z) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 2147483647) + seedOffset; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function noise3D(x, y, z) { const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z); const u = smooth(x - xi), v = smooth(y - yi), w = smooth(z - zi); const a = hash3(xi, yi, zi), b = hash3(xi + 1, yi, zi); const c = hash3(xi, yi + 1, zi), d = hash3(xi + 1, yi + 1, zi); const e = hash3(xi, yi, zi + 1), f = hash3(xi + 1, yi, zi + 1); const g = hash3(xi, yi + 1, zi + 1), h = hash3(xi + 1, yi + 1, zi + 1); const x1 = a * (1 - u) + b * u, x2 = c * (1 - u) + d * u; const x3 = e * (1 - u) + f * u, x4 = g * (1 - u) + h * u; const y1 = x1 * (1 - v) + x2 * v, y2 = x3 * (1 - v) + x4 * v; return y1 * (1 - w) + y2 * w; }

const sections = new Array(CX * CZ * SECTIONS_Y).fill(null);

// Биомный оттенок травы/листвы (аналог colormap): шум -> вариации зелёного по миру
function getBiomeNoise(x, z) {
  const t = Math.max(0, Math.min(1, fbm(x * 0.012, z * 0.012)));
  const h = Math.max(0, Math.min(1, fbm(x * 0.012 + 200, z * 0.012 + 200)));

}
function getGrassTint(x, z) {
  const { t, h } = getBiomeNoise(x, z);

  const g = 0.72 + h * 0.14 - (1 - t) * 0.10;
  const b = 0.22 + h * 0.22 + t * 0.04;
  return [Math.min(1, Math.max(0, r)), Math.min(1, Math.max(0, g)), Math.min(1, Math.max(0, b))];
}
function getFoliageTint(x, z) {
  const { t, h } = getBiomeNoise(x, z);
  const r = 0.22 + (1 - t) * 0.22 - h * 0.04;
  const g = 0.62 + h * 0.18 - (1 - t) * 0.12;
  const b = 0.14 + h * 0.18;
  return [Math.min(1, Math.max(0, r)), Math.min(1, Math.max(0, g)), Math.min(1, Math.max(0, b))];
}

function generateWorldData(wData) {
  world.fill(0); seedOffset = 0; const seedStr = String(wData.seed || '123');
  for (let i = 0; i < seedStr.length; i++) seedOffset += seedStr.charCodeAt(i) * (i + 1);
  for (let z = 0; z < CZ*CHUNK_SIZE; z++) for (let x = 0; x < CX*CHUNK_SIZE; x++) {

        else if (y <= 60 && hash3(x + 50, y, z + 50) < 0.03) b = 15; else if (hash3(x + 200, y, z + 200) < 0.04) b = 14;
        const c1 = noise3D(x * 0.06, y * 0.06, z * 0.06), c2 = noise3D(x * 0.06 + 100, y * 0.06 + 100, z * 0.06 + 100);

    for (let i = 0; i < lakeAttempts; i++) {
      const lx = 2 + Math.floor(hash3(i, 9201, 11) * (CX * CHUNK_SIZE - 4));
      const lz = 2 + Math.floor(hash3(i, 9202, 11) * (CZ * CHUNK_SIZE - 4));
      const ly = 6 + Math.floor(hash3(i, 9203, 11) * 40); // под землёй
      if (getBlock(lx, ly, lz) !== 0) continue; // должен быть воздух пещеры
      // есть потолок над точкой -> не поверхность
      let ceiling = false;
      for (let yy = ly + 1; yy <= Math.min(WORLD_HEIGHT - 1, ly + 12); yy++) {

      }

  }

    type, x, y: y + 1.0, z,
    vx: 0, vy: 0, vz: 0,
    onGround: false, health: type === 'zombie' ? 20 : 10,
    hurtTimer: 0, mesh, parts, skinMeshes,
    walkTimer: Math.random() * 10, wanderTimer: 0, wanderDir: { x: 0, z: 0 }
  });
  return true;
}

function startWandering(m, dt, speed) {
  if (m.wanderTimer <= 0) {
    m.wanderTimer = 2 + Math.random() * 4;
    if (Math.random() < 0.3) m.wanderDir = { x: 0, z: 0 };
    else m.wanderDir = { x: (Math.random() - 0.5) * 2, z: (Math.random() - 0.5) * 2 };
  }
  m.wanderTimer -= dt;
  if (m.wanderDir.x !== 0 || m.wanderDir.z !== 0) {
    m.mesh.rotation.y = Math.atan2(m.wanderDir.x, m.wanderDir.z);
    return { x: m.wanderDir.x, z: m.wanderDir.z, speed };
  }
  return { x: 0, z: 0, speed: 0 };
}

function updateMobs(dt) {
  for (let i = mobs.length - 1; i >= 0; i--) {
    const m = mobs[i];
    const w = m.type === 'zombie' ? 0.3 : 0.4;
    const h = m.type === 'zombie' ? 1.95 : 0.9;

    const isHurt = m.hurtTimer > 0;
    if (isHurt) { m.hurtTimer -= dt; m.mesh.scale.set(1.1, 1.1, 1.1); }
    else m.mesh.scale.set(1, 1, 1);

    m.vy -= 25 * dt;
    const ny = m.y + m.vy * dt;
    if (mobCollides(m.x, ny, m.z, w, h)) {
      if (m.vy < 0) { m.y = Math.floor(ny) + 1.001; m.onGround = true; }
      else if (m.vy > 0) { m.y = Math.floor(ny + h) - h - 0.001; }
      m.vy = 0;
    } else { m.y = ny; m.onGround = false; }

    // если моб оказался внутри блока (край/спавн/рывок) — вытолкнуть вверх
    if (mobCollides(m.x, m.y, m.z, w, h)) {
      let tries = 0;
      while (tries++ < 8 && mobCollides(m.x, m.y, m.z, w, h)) m.y += 1;
      m.onGround = true;
      m.vy = 0;
    }

    let wishX = 0, wishZ = 0, speed = 0;
    if (!isHurt) {
      if (m.type === 'zombie') {
        const dx = player.x - m.x, dz = player.z - m.z, dist = Math.hypot(dx, dz);
        if (dist < 15 && dist > 1.2) {
          wishX = dx / dist; wishZ = dz / dist; speed = 1.8;
          m.mesh.rotation.y = Math.atan2(dx, dz); // модель смотрит в +Z
        } else if (dist >= 15) {
          const walk = startWandering(m, dt, 0.7); wishX = walk.x; wishZ = walk.z; speed = walk.speed;
        }
        if (dist < 1.2 && currentWorldData?.mode === 'survival') {
          if (!m.lastAttack || performance.now() - m.lastAttack > 1000) {
            m.lastAttack = performance.now(); player.health -= 2; playSound('hurt'); updateHUD();
            if (player.health <= 0) { playing = false; document.getElementById('death-screen').classList.add('active'); if (!isTouch) document.exitPointerLock(); }
          }
        }
      } else {
        const walk = startWandering(m, dt, 0.8); wishX = walk.x; wishZ = walk.z; speed = walk.speed;
      }
    }

    const accel = m.onGround ? 10 : 3;
    m.vx += (wishX * speed - m.vx) * Math.min(1, accel * dt);
    m.vz += (wishZ * speed - m.vz) * Math.min(1, accel * dt);

    if (Math.abs(m.vx) > 0.01 || Math.abs(m.vz) > 0.01) {
      let nx = m.x + m.vx * dt;
      if (!mobCollides(nx, m.y, m.z, w, h)) m.x = nx;
      else if (m.onGround) { if (!mobCollides(nx, m.y + 1.01, m.z, w, h)) { m.vy = 8.5; m.onGround = false; } else m.vx = 0; }

      let nz = m.z + m.vz * dt;
      if (!mobCollides(m.x, m.y, nz, w, h)) m.z = nz;
      else if (m.onGround) { if (!mobCollides(m.x, m.y + 1.01, nz, w, h)) { m.vy = 8.5; m.onGround = false; } else m.vz = 0; }
    }

    const isMoving = Math.abs(m.vx) > 0.1 || Math.abs(m.vz) > 0.1;
    if (isMoving && m.onGround) {
      m.walkTimer += dt * 12;
      const swing = Math.sin(m.walkTimer) * 0.6;
      if (m.parts.legL) { m.parts.legL.rotation.x = swing; m.parts.legR.rotation.x = -swing; m.parts.armL.rotation.x = -swing * 0.8; m.parts.armR.rotation.x = swing * 0.8; }
      if (m.parts.leg1) { m.parts.leg1.rotation.x = swing; m.parts.leg4.rotation.x = swing; m.parts.leg2.rotation.x = -swing; m.parts.leg3.rotation.x = -swing; }
    } else {
      if (m.parts.legL) { m.parts.legL.rotation.x = 0; m.parts.legR.rotation.x = 0; m.parts.armL.rotation.x = 0; m.parts.armR.rotation.x = 0; }
      if (m.parts.leg1) { m.parts.leg1.rotation.x = 0; m.parts.leg2.rotation.x = 0; m.parts.leg3.rotation.x = 0; m.parts.leg4.rotation.x = 0; }
    }

    if (m.y < -10 || Math.hypot(m.x - player.x, m.z - player.z) > 60) {
      scene.remove(m.mesh); mobs.splice(i, 1); continue;
    }
    m.mesh.position.set(m.x, m.y, m.z);
  }
}

// --- АТАКА И ДРОП ---
function giveItem(id, count = 1) {
  if (currentWorldData?.mode !== 'survival') return;
  for (let i = 0; i < 9; i++) {
    if (survivalHotbar[i] && survivalHotbar[i].id === id) { survivalHotbar[i].count += count; buildHotbarUI(); return; }
  }
  for (let i = 0; i < 9; i++) {
    if (!survivalHotbar[i]) { survivalHotbar[i] = { id, count }; buildHotbarUI(); return; }
  }
}

function attackMob() {
  const maxDist = 3.5;
  const _dir = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation).normalize();
  let closestMob = null;
  let closestDist = maxDist;

  for (const m of mobs) {
    const centerY = m.y + (m.type === 'zombie' ? 1 : 0.45);
    const dx = m.x - camera.position.x, dy = centerY - camera.position.y, dz = m.z - camera.position.z;
    const dist = Math.hypot(dx, dy, dz);
    if (dist < closestDist) {
      const dot = (dx * _dir.x + dy * _dir.y + dz * _dir.z) / dist;
      if (dot > 0.75) { closestMob = m; closestDist = dist; }
    }
  }

  if (closestMob) {
    closestMob.health -= 5;
    closestMob.hurtTimer = 0.4; // пока болит — не гонится, отлёт виден
    playSound('hurt');
    const kbX = closestMob.x - player.x, kbZ = closestMob.z - player.z;
    const kbLen = Math.hypot(kbX, kbZ) || 1;
    closestMob.vx = (kbX / kbLen) * 6;
    closestMob.vz = (kbZ / kbLen) * 6;
    closestMob.vy = 4;
    closestMob.onGround = false;

    if (closestMob.health <= 0) {
      scene.remove(closestMob.mesh);
      mobs.splice(mobs.indexOf(closestMob), 1);
      giveItem(closestMob.type === 'zombie' ? 2 : 1, 1); 
      showToast(closestMob.type === 'zombie' ? 'Зомби повержен!' : 'Свинья убита');
    }
    return true; // Успешная атака
  }
  return false;
}

// --- ВЗАИМОДЕЙСТВИЕ ---
const _dir = new THREE.Vector3();
function raycastBlock(maxDist = 6) {
  _dir.set(0, 0, -1).applyEuler(camera.rotation).normalize();
  if (_dir.x === 0) _dir.x = 0.00001; if (_dir.y === 0) _dir.y = 0.00001; if (_dir.z === 0) _dir.z = 0.00001;
  let x = Math.floor(camera.position.x), y = Math.floor(camera.position.y), z = Math.floor(camera.position.z);
  const stepX = _dir.x > 0 ? 1 : -1, stepY = _dir.y > 0 ? 1 : -1, stepZ = _dir.z > 0 ? 1 : -1;
  const tDeltaX = Math.abs(1 / _dir.x), tDeltaY = Math.abs(1 / _dir.y), tDeltaZ = Math.abs(1 / _dir.z);
  let tMaxX = (_dir.x > 0 ? x + 1 - camera.position.x : camera.position.x - x) / Math.abs(_dir.x), tMaxY = (_dir.y > 0 ? y + 1 - camera.position.y : camera.position.y - y) / Math.abs(_dir.y), tMaxZ = (_dir.z > 0 ? z + 1 - camera.position.z : camera.position.z - z) / Math.abs(_dir.z);
  let nx = 0, ny = 0, nz = 0, t = 0;
  while (t <= maxDist) {
    if (getBlock(x, y, z) !== 0) return { x, y, z, nx, ny, nz };
    if (tMaxX < tMaxY && tMaxX < tMaxZ) { x += stepX; t = tMaxX; tMaxX += tDeltaX; nx = -stepX; ny = 0; nz = 0; }
    else if (tMaxY < tMaxZ) { y += stepY; t = tMaxY; tMaxY += tDeltaY; nx = 0; ny = -stepY; nz = 0; }
    else { z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ; nx = 0; ny = 0; nz = -stepZ; }
  }
  return null;
}

function breakBlock() {
  const hit = raycastBlock();
  if (!hit) return;
  const b = getBlock(hit.x, hit.y, hit.z); // сначала запомнили блок, потом ломаем
  if (b === 0 || b === 13) return;
  setBlock(hit.x, hit.y, hit.z, 0, true); updateLocalLighting(hit.x, hit.y, hit.z); playSound('break');
  if (currentWorldData?.mode === 'survival') {
    const def = BLOCKS[b];
    if (def?.fluid) {
      if (def.fluidSource) giveItem(b);
    } else giveItem(b);
  }
}

function placeBlock() {
  const hit = raycastBlock(); if (!hit) return;
  const nx = hit.x + hit.nx, ny = hit.y + hit.ny, nz = hit.z + hit.nz;
  const isSurv = currentWorldData?.mode === 'survival';
  const item = isSurv ? survivalHotbar[selectedSlot] : { id: creativeHotbar[selectedSlot] };
  const itemId = item?.id;
  if (!itemId) return;

  // Яйца призыва: спавним моба (принудительно, чтобы лимит авто-спавна не мешал)
  if (EGGS[itemId]) {
    if (isSurv) { showToast('Яйца работают только в креативе'); return; }
    const ok = spawnMob(EGGS[itemId].mob, nx + 0.5, ny, nz + 0.5, true);
    if (ok) { playSound('place'); showToast(`Заспавнен: ${EGGS[itemId].name}`); }
    else showToast('Не удалось заспавнить моба');
    return;
  }

  if (getBlock(nx, ny, nz) === 0 && !playerCollides(nx+0.5, ny+0.5, nz+0.5)) {
    setBlock(nx, ny, nz, itemId, true); updateLocalLighting(nx, ny, nz); playSound('place');
    if (isSurv) {
      item.count--;
      if (item.count <= 0) survivalHotbar[selectedSlot] = null;
      buildHotbarUI();
    }
  }
}

// --- ДЕНЬ И НОЧЬ ---
function updateDayNight(dt) {
  timeOfDay += dt * 0.005; if (timeOfDay > 1) timeOfDay -= 1;
  const angle = timeOfDay * Math.PI * 2;
  sunMesh.position.set(player.x + Math.sin(angle) * 100, player.y + Math.cos(angle) * 100, player.z); sunMesh.lookAt(player.x, player.y, player.z);
  moonMesh.position.set(player.x - Math.sin(angle) * 100, player.y - Math.cos(angle) * 100, player.z); moonMesh.lookAt(player.x, player.y, player.z);
  const dayColor = new THREE.Color(0x87ceeb), nightColor = new THREE.Color(0x000022), sunsetColor = new THREE.Color(0xff7733);
  let currentColor = new THREE.Color();
  if (timeOfDay < 0.2) currentColor.lerpColors(sunsetColor, dayColor, timeOfDay / 0.2);
  else if (timeOfDay < 0.4) currentColor.copy(dayColor);
  else if (timeOfDay < 0.6) currentColor.lerpColors(dayColor, sunsetColor, (timeOfDay - 0.4) / 0.2);
  else if (timeOfDay < 0.8) currentColor.lerpColors(sunsetColor, nightColor, (timeOfDay - 0.6) / 0.2);
  else currentColor.lerpColors(nightColor, sunsetColor, (timeOfDay - 0.8) / 0.2);
  scene.background.copy(currentColor); scene.fog.color.copy(currentColor);
}

function getBlockIcon(id) {

}

function initDB() { return new Promise(r => { const req = indexedDB.open('VoxelMine', 1); req.onupgradeneeded = e => e.target.result.createObjectStore('worlds', { keyPath: 'id' }); req.onsuccess = e => { db = e.target.result; r(); }; req.onerror = () => r(); }); }

    const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const savesDir = await dirHandle.getDirectoryHandle('saves', { create: true });
    const w = worlds.find(x => x.id === selectedWorldId);
    const wDir = await savesDir.getDirectoryHandle(w.name.replace(/[^a-z0-9а-яё]/gi, '_'), { create: true });
    const lvlFile = await wDir.getFileHandle('level.json', { create: true });
    const lvlW = await lvlFile.createWritable(); await lvlW.write(JSON.stringify({ id: w.id, name: w.name, seed: w.seed, mode: w.mode })); await lvlW.close();
    const regDir = await wDir.getDirectoryHandle('region', { create: true });
    const chunksMap = {};
    for (const [key, val] of Object.entries(w.changedBlocks || {})) {
      const [x, y, z] = key.split(',').map(Number); const cx = Math.floor(x / 16), cz = Math.floor(z / 16); const ck = `r.${cx}.${cz}.json`;
      if (!chunksMap[ck]) chunksMap[ck] = {}; chunksMap[ck][key] = val;
    }
    for (const [ck, data] of Object.entries(chunksMap)) {
      const f = await regDir.getFileHandle(ck, { create: true }); const wr = await f.createWritable(); await wr.write(JSON.stringify(data)); await wr.close();
    }
    window.showToast('Мир сохранен в папку!');
  } catch(e) { window.showToast('Ошибка сохранения'); }
}

window.loadWorld = (wData) => {
  if (!isAtlasLoaded) { showToast("Подождите, текстуры загружаются..."); return; }
  
  currentWorldData = wData;
  for (const m of mobs) scene.remove(m.mesh); // мобы старого мира не должны переезжать в новый
  mobs.length = 0;
  generateWorldData(wData);
  for (let cx = 0; cx < CX; cx++) for (let cz = 0; cz < CZ; cz++) processLightingChunk(cx, cz);
  
  document.getElementById('loading-screen').classList.add('active');
  document.getElementById('ui-layer').classList.add('hidden');
  renderer.domElement.style.display = 'block';
  
  let sectionsToBuild = [];
  for (let cx = 0; cx < CX; cx++) for (let cz = 0; cz < CZ; cz++) for (let cy = 0; cy < SECTIONS_Y; cy++) sectionsToBuild.push({cx, cy, cz});
  let built = 0, total = sectionsToBuild.length;
  
  function buildNextSections() {
    const start = performance.now();
    while (sectionsToBuild.length > 0 && performance.now() - start < 10) { const {cx, cy, cz} = sectionsToBuild.shift(); buildSection(cx, cy, cz); built++; }
    document.getElementById('loading-bar').style.width = (built/total*100)+'%';
    document.getElementById('loading-percent').textContent = Math.floor(built/total*100) + '%';
    if (sectionsToBuild.length > 0) requestAnimationFrame(buildNextSections);
    else {
      document.getElementById('loading-bar').style.width = '100%';
      const baseSpawn = findSafeSpawn(CX * CHUNK_SIZE / 2, CZ * CHUNK_SIZE / 2);
      worldSpawn = { x: baseSpawn.x, y: baseSpawn.y, z: baseSpawn.z };
      let startPos = baseSpawn;
      const sp = wData.playerPos;
      if (sp && Number.isFinite(sp.x) && Number.isFinite(sp.y) && Number.isFinite(sp.z)) {
        const px = Math.max(PR + 0.01, Math.min(CX * CHUNK_SIZE - PR - 0.01, sp.x));
        const pz = Math.max(PR + 0.01, Math.min(CZ * CHUNK_SIZE - PR - 0.01, sp.z));
        const py = Math.max(1, Math.min(WORLD_HEIGHT - 2, sp.y));
        // если сохранённая позиция в блоках — пробуем чуть выше, иначе безопасный спавн
        if (!playerCollides(px, py, pz)) startPos = { x: px, y: py, z: pz };
        else if (!playerCollides(px, py + 1, pz)) startPos = { x: px, y: py + 1, z: pz };
        else startPos = findSafeSpawn(px, pz);
      }
      player.x = startPos.x; player.y = startPos.y; player.z = startPos.z; player.health = 20; player.vx = player.vy = player.vz = 0;
      setTimeout(() => {
        document.getElementById('pause-layer').classList.remove('active'); document.getElementById('loading-screen').classList.remove('active');
        document.getElementById('game-ui').style.display = 'block'; playing = true; buildHotbarUI(); updateHUD();
        if (!isTouch) renderer.domElement.requestPointerLock();
      }, 200);
    }
  }
  requestAnimationFrame(buildNextSections);
};

window.saveAndQuitGame = async () => {
  if (currentWorldData) { currentWorldData.playerPos = { x: player.x, y: player.y, z: player.z }; await saveWorld(currentWorldData); }
  document.getElementById('pause-layer').classList.remove('active'); showScreen('screen-main'); selectedWorldId = null;
};
window.resumeGame = () => { document.getElementById('pause-layer').classList.remove('active'); playing = true; if (!isTouch) renderer.domElement.requestPointerLock(); };
window.respawnPlayer = () => {
  player.health = 20;
  const spawn = findSafeSpawn(worldSpawn.x, worldSpawn.z);
  player.x = spawn.x; player.z = spawn.z; player.y = spawn.y; player.vx = player.vy = player.vz = 0;
  document.getElementById('death-screen').classList.remove('active'); playing = true;
};

// --- УПРАВЛЕНИЕ ---
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); if (currentWorldData?.mode === 'creative') { const now = performance.now(); if (now - (window.lastSpaceTap || 0) < 300) player.flying = !player.flying; window.lastSpaceTap = now; } }
  if (e.code === 'Escape') {
    if (document.getElementById('inventory-screen').classList.contains('active') || document.getElementById('survival-inventory').classList.contains('active')) toggleInventory();
    else if (playing) { playing = false; document.getElementById('pause-layer').classList.add('active'); if(!isTouch) document.exitPointerLock(); }
  }
  if (e.code === 'KeyE') { e.preventDefault(); toggleInventory(); }
  if (e.code.startsWith('Digit')) { const n = parseInt(e.code.slice(5)) - 1; if(n>=0 && n<9){ selectedSlot = n; buildHotbarUI(); } }
});
addEventListener('keyup', e => keys[e.code] = false);

document.addEventListener('mousemove', e => {
  if (isTouch || !playing || document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.002 * (SETTINGS.sens/100); pitch -= (SETTINGS.invertY ? -e.movementY : e.movementY) * 0.002 * (SETTINGS.sens/100);
  pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, pitch));
});
document.addEventListener('mousedown', e => {
  if (isTouch || !playing || document.pointerLockElement !== renderer.domElement) return;
  if (e.button === 0) {
    if (attackMob()) return; // Если попали по мобу, блок не ломаем
    breakBlock();
  }
  if (e.button === 2) placeBlock();
});
document.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => { if (isTouch || !playing || document.pointerLockElement !== renderer.domElement) return; selectedSlot = (selectedSlot + Math.sign(e.deltaY) + 9) % 9; buildHotbarUI(); }, {passive: true});

const joyVector = { x: 0, y: 0 };
const joyEl = document.getElementById('joystick'), knob = document.getElementById('joystick-knob');
let joyTouchId = null, lookTouchId = null, lookLastX = 0, lookLastY = 0, lastTouchJumpTap = 0;

function isGameControlTarget(t) {
  return !!(t && t.closest && t.closest('#joystick,#action-buttons,#bottom-ui,#btn-pause,#btn-camera,#btn-inventory,#inventory-screen,#survival-inventory,#pause-layer,#ui-layer,#death-screen,#ad-modal'));
}

if (isTouch) {
  function updateJoyFromTouch(t) {
    const r = joyEl.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = (t.clientX - cx) / (r.width / 2);
    let dy = (t.clientY - cy) / (r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }
    joyVector.x = dx; joyVector.y = dy;
    knob.style.transform = `translate(calc(-50% + ${dx * 40}px), calc(-50% + ${dy * 40}px))`;
  }
  joyEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (joyTouchId !== null) return;
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    updateJoyFromTouch(t);
  }, { passive: false });
  joyEl.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === joyTouchId) { updateJoyFromTouch(t); break; }
  }, { passive: false });
  const joyEnd = e => {
    for (const t of e.changedTouches) if (t.identifier === joyTouchId) {
      joyTouchId = null; joyVector.x = 0; joyVector.y = 0;
      knob.style.transform = 'translate(-50%, -50%)';
    }
  };
  joyEl.addEventListener('touchend', joyEnd);
  joyEl.addEventListener('touchcancel', joyEnd);

  // Поворот камеры касанием по экрану
  renderer.domElement.addEventListener('touchstart', e => {
    if (!playing) return;
    for (const t of e.changedTouches) {
      if (lookTouchId === null && !isGameControlTarget(t.target)) {
        lookTouchId = t.identifier; lookLastX = t.clientX; lookLastY = t.clientY;
        e.preventDefault();
      }
    }
  }, { passive: false });
  renderer.domElement.addEventListener('touchmove', e => {
    if (!playing || lookTouchId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouchId) {
        const dx = t.clientX - lookLastX, dy = t.clientY - lookLastY;
        lookLastX = t.clientX; lookLastY = t.clientY;
        const sens = 0.004 * (SETTINGS.sens / 100);
        yaw -= dx * sens;
        pitch -= (SETTINGS.invertY ? -dy : dy) * sens;
        pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
        e.preventDefault();
      }
    }
  }, { passive: false });
  const endLook = e => { for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null; };
  renderer.domElement.addEventListener('touchend', endLook);
  renderer.domElement.addEventListener('touchcancel', endLook);

  // Кнопки действий
  document.getElementById('btn-break').addEventListener('click', e => { e.preventDefault(); if (playing) { if (!attackMob()) breakBlock(); } });
  document.getElementById('btn-place').addEventListener('click', e => { e.preventDefault(); if (playing) placeBlock(); });

  const btnJump = document.getElementById('btn-jump');
  btnJump.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!playing) return;
    const now = performance.now();
    if (currentWorldData?.mode === 'creative' && now - lastTouchJumpTap < 300) player.flying = !player.flying;
    lastTouchJumpTap = now;
    keys['Space'] = true;
  }, { passive: false });
  const jumpEnd = e => { e.preventDefault(); keys['Space'] = false; };
  btnJump.addEventListener('touchend', jumpEnd, { passive: false });
  btnJump.addEventListener('touchcancel', () => { keys['Space'] = false; });

  const btnDown = document.getElementById('btn-down');
  btnDown.addEventListener('touchstart', e => { e.preventDefault(); keys['ShiftLeft'] = true; }, { passive: false });
  const downEnd = e => { e.preventDefault(); keys['ShiftLeft'] = false; };
  btnDown.addEventListener('touchend', downEnd, { passive: false });
  btnDown.addEventListener('touchcancel', () => { keys['ShiftLeft'] = false; });
}

// Кнопки UI (работают и на тач-устройствах)
document.getElementById('btn-inventory').addEventListener('click', e => { e.preventDefault(); toggleInventory(); });
document.getElementById('btn-pause').addEventListener('click', e => {
  e.preventDefault();
  const invOpen = document.getElementById('inventory-screen').classList.contains('active') || document.getElementById('survival-inventory').classList.contains('active');
  if (invOpen) { toggleInventory(); return; }
  if (playing) { playing = false; document.getElementById('pause-layer').classList.add('active'); }
  else if (document.getElementById('pause-layer').classList.contains('active')) { resumeGame(); }
});

// Адаптация под размер экрана/поворот телефона
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 120));

// --- ТЕКУЧИЕ ЖИДКОСТИ (распространение от источников) ---
let fluidTimer = 0;
function tickFluids() {
  if (!playing) return;
  const r = 28;
  const minX = Math.max(1, Math.floor(player.x) - r), maxX = Math.min(CX * CHUNK_SIZE - 2, Math.floor(player.x) + r);
  const minZ = Math.max(1, Math.floor(player.z) - r), maxZ = Math.min(CZ * CHUNK_SIZE - 2, Math.floor(player.z) + r);
  const minY = Math.max(1, Math.floor(player.y) - 20), maxY = Math.min(WORLD_HEIGHT - 2, Math.floor(player.y) + 20);
  const sx = maxX - minX + 1, sy = maxY - minY + 1, sz = maxZ - minZ + 1;
  const size = sx * sy * sz;
  if (size <= 0) return;
  const distA = new Uint8Array(size); distA.fill(255);
  const typeA = new Uint8Array(size); // 0 none, 1 water, 2 lava
  const li = (x, y, z) => (x - minX) + sx * ((z - minZ) + sz * (y - minY));
  const qx = new Int32Array(size), qy = new Int32Array(size), qz = new Int32Array(size), qd = new Uint8Array(size), qt = new Uint8Array(size);
  let head = 0, tail = 0;

  const passable = (x, y, z) => {
    const b = getBlock(x, y, z);
    return b === 0 || (isFluidBlock(b) && !isFluidSource(b));
  };
  const enqueue = (x, y, z, type, d) => {
    if (x < minX || x > maxX || y < minY || y > maxY || z < minZ || z > maxZ) return;
    const idxL = li(x, y, z);
    if (distA[idxL] <= d) return;
    const b = getBlock(x, y, z);
    if (b !== 0 && !(isFluidBlock(b) && !isFluidSource(b))) return;
    distA[idxL] = d; typeA[idxL] = type;
    qx[tail] = x; qy[tail] = y; qz[tail] = z; qd[tail] = d; qt[tail] = type; tail++;
  };

  // Источники — стартовые точки (в т.ч. поставленные и озёра)
  for (let y = minY; y <= maxY; y++) for (let z = minZ; z <= maxZ; z++) for (let x = minX; x <= maxX; x++) {
    const b = getBlock(x, y, z);
    if (!isFluidSource(b)) continue;
    const type = BLOCKS[b].fluid === 'water' ? 1 : 2;
    const idxL = li(x, y, z);
    distA[idxL] = 0; typeA[idxL] = type;
  }
  // сначала вниз от источников, иначе в стороны
  for (let y = minY; y <= maxY; y++) for (let z = minZ; z <= maxZ; z++) for (let x = minX; x <= maxX; x++) {
    const idxL = li(x, y, z);
    if (distA[idxL] !== 0) continue;
    const type = typeA[idxL];
    const maxD = type === 1 ? 8 : 4;
    if (passable(x, y - 1, z)) enqueue(x, y - 1, z, type, 1);
    else {
      if (passable(x - 1, y, z)) enqueue(x - 1, y, z, type, 1);
      if (passable(x + 1, y, z)) enqueue(x + 1, y, z, type, 1);
      if (passable(x, y, z - 1)) enqueue(x, y, z - 1, type, 1);
      if (passable(x, y, z + 1)) enqueue(x, y, z + 1, type, 1);
    }
  }

  while (head < tail) {
    const x = qx[head], y = qy[head], z = qz[head], d = qd[head], type = qt[head]; head++;
    const maxD = type === 1 ? 8 : 4;
    if (passable(x, y - 1, z)) {
      // падение: струя вниз, от неё можно растекаться дальше (расстояние 1)
      enqueue(x, y - 1, z, type, 1);
    } else if (d < maxD) {
      if (passable(x - 1, y, z)) enqueue(x - 1, y, z, type, d + 1);
      if (passable(x + 1, y, z)) enqueue(x + 1, y, z, type, d + 1);
      if (passable(x, y, z - 1)) enqueue(x, y, z - 1, type, d + 1);
      if (passable(x, y, z + 1)) enqueue(x, y, z + 1, type, d + 1);
    }
  }

  // Применяем результат: источники не трогаем, течения не сохраняем в changedBlocks
  const relightCols = new Set();
  for (let y = minY; y <= maxY; y++) for (let z = minZ; z <= maxZ; z++) for (let x = minX; x <= maxX; x++) {
    const cur = getBlock(x, y, z);
    if (isFluidSource(cur)) continue;
    const idxL = li(x, y, z);
    const d = distA[idxL], type = typeA[idxL];
    const want = (d === 255 || type === 0) ? 0 : fluidFlowId(type === 1 ? 'water' : 'lava', d);
    if (cur === want) continue;
    if (cur !== 0 && !(isFluidBlock(cur) && !isFluidSource(cur))) continue;
    setBlock(x, y, z, want, false);
    for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) markSectionDirty(x + dx, y + dy, z + dz);
    const cx = Math.floor(x / CHUNK_SIZE), cz = Math.floor(z / CHUNK_SIZE);
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) relightCols.add((cx + dx) + ',' + (cz + dz));
  }
  for (const key of relightCols) {
    const [cx, cz] = key.split(',').map(Number);
    if (cx >= 0 && cx < CX && cz >= 0 && cz < CZ) processLightingChunk(cx, cz);
  }
}

// --- ЦИКЛ ИГРЫ ---
const clock = new THREE.Clock();
let spawnTimer = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  
  updateDayNight(dt);

  if (playing && currentWorldData) {
    physicsStep(dt);
    camera.position.set(player.x, player.y + EYE, player.z); camera.rotation.y = yaw; camera.rotation.x = pitch;
    
    const hit = raycastBlock();
    if (hit) { highlight.visible = true; highlight.position.set(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5); } else highlight.visible = false;

    spawnTimer += dt;
    if (spawnTimer > 3) {
      spawnTimer = 0;
      if (SETTINGS.difficulty !== 'Мирно' && Math.random() < 0.6) spawnMob('zombie');
      if (Math.random() < 0.4) spawnMob('pig');
    }
    updateMobs(dt);

    fluidTimer += dt;
    if (fluidTimer > 0.1) { fluidTimer = 0; tickFluids(); }
  } else {
    highlight.visible = false;
  }
  
  const start = performance.now();
  while (sectionQueue.length > 0 && performance.now() - start < 8) {
    const { cx, cy, cz } = sectionQueue.shift(); dirtySections.delete(`${cx},${cy},${cz}`); buildSection(cx, cy, cz);
  }
  renderer.render(scene, camera);
}

// Небольшой отладочный хук (удобно проверять мобов из консоли/автотестов).
window.__voxelDebug = {
  mobs, player, camera, scene,
  spawnMob, attackMob,
  getSkinState: () => ({
    zombie: !!mobImages.zombie, pig: !!mobImages.pig,
    zombieMats: !!cachedSkinMats.zombie, pigMats: !!cachedSkinMats.pig
  })
};

initDB().then(() => { showScreen('screen-main'); animate(); });
</script>
